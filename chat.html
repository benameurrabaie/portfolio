<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groq Chat</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 10px; }
  #chat { border: 1px solid #ccc; border-radius: 6px; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
  .msg { margin: 8px 0; }
  .user { color: #1a4; font-weight: bold; }
  .assistant { color: #24a; font-weight: bold; }
  #inputRow { display: flex; gap: 8px; }
  #userInput { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>

<h2>Groq Chat</h2>
<div id="chat"></div>
<div id="inputRow">
  <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
const API_KEY = "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";
const MODEL = "openai/gpt-oss-120b"; // change model here if needed

let history = [];

function appendMessage(role, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `<span class="${role}">${role === "user" ? "You" : "Bot"}:</span> ${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  appendMessage("user", text);
  history.push({ role: "user", content: text });
  input.value = "";

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      appendMessage("assistant", "Error: " + errText);
      return;
    }

    const data = await response.json();
    const reply = data.choices[0].message.content;
    history.push({ role: "assistant", content: reply });
    appendMessage("assistant", reply);
  } catch (err) {
    appendMessage("assistant", "Request failed: " + err.message);
  }
}
</script>

</body>
</html>
