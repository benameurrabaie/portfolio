p{margin:.3em 0}.lead,.legend{color:var(--muted)}.legend{font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px}@media(min-width:840px){.grid{grid-template-columns:1.25fr 1fr}}

.tools{margin:10px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--accent);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;min-height:44px}
button[aria-pressed="true"],.go{background:var(--accent);color:var(--afg)}
button:focus-visible,select:focus-visible,input:focus-visible,svg [tabindex]:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
select,input{font:inherit;padding:6px;min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
svg{width:100%;height:auto;display:block;border-radius:8px}#bench svg{max-width:330px;margin:6px auto}

pre{background:#0a140e;color:#8cf0c4;padding:10px;border-radius:8px;overflow:auto;font-size:.78rem;margin:8px 0 0;min-height:70px;max-height:200px;white-space:pre-wrap}
.blink{animation:bl .25s infinite alternate}@keyframes bl{to{opacity:.2}}

.z{animation:zm .4s}@keyframes zm{from{transform:scale(.4);opacity:0}}

</style>

$("bench").innerHTML='<svg class="z" viewBox="0 0 300 150" role="img" aria-label="'+p.n[L]+'"><circle cx="150" cy="75" r="72" fill="#999"/><circle cx="150" cy="75" r="68" fill="var(--board)"/>'+(k=="ic"?'<rect x="85" y="25" width="130" height="100" rx="6" fill="#1b1b1b"/><circle cx="100" cy="40" r="5" fill="#aaa"/>':k=="c1"?'<rect x="110" y="30" width="80" height="90" rx="12" fill="#e0a43b"/>':k=="r1"?'<rect x="75" y="50" width="150" height="50" rx="8" fill="#d8c39a"/>':'<circle cx="150" cy="75" r="45" fill="var(--trace)"/>')+p.mk.map(function(m,i){return'<text x="150" y="'+(82+i*24-(p.mk.length-1)*10)+'" text-anchor="middle" font-family="monospace" font-size="22" fill="'+(k=="ic"?"#ddd":"#222")+'">'+m+"</text>"}).join("")+"</svg>";
note("tip",p.n[L],p.t[L]+" <span class='legend'>("+Object.keys(seen).length+"/8)</span>");ui()}
else if(tool=="meter")meterHit(k);
else if(tool=="logic")logicHit(k)}
function meterHit(k){var p=PT[k];
if(mm.mode=="off")return note("bad",T("Meter is off","Multimètre éteint"),T("Turn the dial to V⎓ or Ω))) before placing probes.","Tournez le sélecteur sur V⎓ ou Ω))) avant de poser les sondes."));
if(mm.r&&mm.b){mm.r=mm.b=null;$("bench").querySelectorAll("[data-m]");lcd(mm.mode=="v"?"0.00":"OL",mm.mode=="v"?"V":"Ω")}
if(!mm.r){mm.r=k;moveTip(0,p.x,p.y);pi();note("tip",T("Red probe placed","Sonde rouge posée"),T("Red probe on ","Sonde rouge sur ")+p.n[L]+T(". Now place the black probe.",". Posez maintenant la sonde noire."));return}
if(mm.b)return;mm.b=k;moveTip(1,p.x,p.y,function(){evalM()});pi()}
function evalM(){var a=PT[mm.r],b=PT[mm.b],nm=a.n[L]+" ↔ "+b.n[L];
if(mm.mode=="c"){
if(pw){lcd("Err","");return note("bad",T("Continuity on a powered board","Continuité sur carte allumée"),T("The meter injects a tiny current and assumes the circuit is dead. With the board powered, its 3.3 V corrupts the reading and can damage the meter. Switch the board OFF first.","Le multimètre injecte un petit courant en supposant le circuit éteint. Carte alimentée, les 3,3 V faussent la mesure et peuvent l’abîmer. Éteignez d’abord la carte."))}
if(mm.r==mm.b){lcd("OL","Ω");return note("tip",T("Same point","Même point"),T("Both probes are on the same point; pick two different points.","Les deux sondes sont sur le même point ; choisissez deux points différents."))}
var ok=conn(mm.r,mm.b);
if(ok){lcd("0.4","Ω");$("bp").setAttribute("opacity",1);beep();cont[[mm.r,mm.b].sort().join()]=1;ui();note("ok",T("Continuity: connected","Continuité : relié"),nm+T(": reads about 0.4 Ω with a beep. A copper trace joins these two points, so they share the same electrical net.",": environ 0,4 Ω avec un bip. Une piste de cuivre relie ces deux points : ils sont sur le même nœud."))}
else{lcd("OL","Ω");var sh=(mm.r=="vcc"&&mm.b=="gnd")||(mm.r=="gnd"&&mm.b=="vcc");note(sh?"ok":"tip",sh?T("VCC–GND: no short, good","VCC–GND : pas de court-circuit, bon"):T("Open circuit (OL)","Circuit ouvert (OL)"),nm+(sh?T(": OL means open. It is exactly what you want between power and ground; if it beeped, the board would have a short circuit.",": OL signifie ouvert. C’est ce qu’on veut entre alimentation et masse ; un bip signalerait un court-circuit."):T(": OL (over limit) means no direct copper path. They may still communicate through the chip.",": OL (hors limite) signifie pas de chemin direct en cuivre. Ils peuvent communiquer via la puce.")))}return}
if(mm.mode=="v"){
if(!pw){lcd("0.00","V");$("lcd").dataset.v=0;return note("tip",T("0.00 V: the board is off","0,00 V : carte éteinte"),T("No supply, so no voltage anywhere. Switch Board power ON, then measure again.","Pas d’alimentation, donc aucune tension. Allumez la carte puis mesurez de nouveau."))}
var v=a.v-b.v;
if(mm.r==mm.b){lcd("0.00","V",0);return note("tip",T("Same point","Même point"),T("Both probes touch the same point: no difference, 0.00 V.","Les deux sondes touchent le même point : aucune différence, 0,00 V."))}
lcd("","V",v);
if(v<0)return note("bad",T("Probes reversed: "+v.toFixed(2)+" V","Sondes inversées : "+v.toFixed(2)+" V"),T("A minus sign means the red probe is at a lower voltage than the black one. Put black on GND and red on the point to measure.","Un signe moins signifie que la sonde rouge est à une tension plus basse que la noire. Mettez la noire sur GND et la rouge sur le point à mesurer."));
if(mm.b!="gnd")return note("tip",v.toFixed(2)+" V = "+a.v.toFixed(2)+" − "+b.v.toFixed(2),T("You measured a difference between two points, not a voltage relative to ground. For rail checks, put the black probe on GND.","Vous mesurez une différence entre deux points, pas une tension par rapport à la masse. Pour vérifier un rail, mettez la noire sur GND."));
if(mm.r=="vcc"){G.v=1;ui()}
note("ok",v.toFixed(2)+" V ("+T("red − black","rouge − noire")+")",a.n[L]+": "+a.m[L]+(mm.r=="vcc"?T(" Tolerance: 3.3 V ±5 % = 3.14–3.47 V. Reading "+v.toFixed(2)+" V is inside.",""+" Tolérance : 3,3 V ±5 % = 3,14–3,47 V. La lecture "+v.toFixed(2)+" V est dans la plage."):""))}}
var tb2={1:300,10:300,100:300};
function wave(s,tb){var d="M0 30",i;
if(s=="tp"){var n=Math.min(10*tb,100),w=300/n;for(i=0;i<n;i++)d+="H"+(i*w+w/2)+"V90H"+(i+1)*w+"V30";return d}
if(s=="tx"){var bits=[1],pb=300/(10*tb/8.68),c="BOOT>",x=0,cur=1;for(i=0;i<5;i++){var ch=c.charCodeAt(i);bits.push(0);for(var j=0;j<8;j++)bits.push((ch>>j)&1);bits.push(1)}bits.push(1,1);
for(i=0;i<bits.length&&x<300;i++){var y=bits[i]?30:90;if(bits[i]!=cur){d+="V"+y;cur=bits[i]}x=Math.min(300,x+pb);d+="H"+x}return d}
return"M0 30H300"}
function screen(a,d,txt,noise,flat){var g="";for(var i=1;i<10;i++)g+='<line x1="'+i*30+'" y1="0" x2="'+i*30+'" y2="120" stroke="#1d3b2a"/>';
$("scr").innerHTML='<svg viewBox="0 0 320 170" role="img" aria-label="Logic analyser"><rect width="320" height="170" rx="10" fill="#2a2f3a"/><rect x="8" y="8" width="304" height="124" rx="4" fill="#07120b"/><clipPath id="cl"><rect x="0" y="0" width="0" height="140"><animate attributeName="width" from="0" to="320" dur="1.1s" fill="freeze"/></rect></clipPath><g transform="translate(10 10)">'+g+'<path clip-path="url(#cl)" d="'+d+'" fill="none" stroke="#5dff9f" stroke-width="2"/></g><line y1="8" y2="132" stroke="#fff" opacity=".6"><animate attributeName="x1" from="10" to="310" dur="1.1s" fill="freeze"/><animate attributeName="x2" from="10" to="310" dur="1.1s" fill="freeze"/><animate attributeName="opacity" from=".7" to="0" dur="1.3s" fill="freeze"/></line><text x="14" y="22" font-size="10" fill="#8cf0c4" font-family="monospace">CH0 '+(lg.ch?PT[lg.ch].mk[0]:"–")+'  ·  '+lg.tb+' µs/div</text><circle cx="30" cy="152" r="5" fill="'+(lg.ch?"#5dff9f":"#555")+'"/><text x="44" y="156" font-size="10" fill="#cfd6e3">RUN</text><text x="200" y="156" font-size="10" fill="#cfd6e3">GND '+(lg.g?"✓":"✗")+'</text></svg><p style="background:#0a140e;color:#8cf0c4;padding:8px;border-radius:8px;font-family:monospace;font-size:.85rem">'+txt+"</p>"}
function logicHit(k){var p=PT[k];
if(k=="gnd"){lg.g=1;moveTip(1,p.x,p.y);return note("ok",T("Ground lead clipped","Pince de masse posée"),T("Now the analyser and the board share the same 0 V reference, so highs and lows are measured correctly. Next, clip a channel on a signal.","L’analyseur et la carte partagent désormais la même référence 0 V : les niveaux hauts et bas sont corrects. Pincez maintenant une voie sur un signal."))}
lg.ch=k;moveTip(0,p.x,p.y,function(){capture()})}
function capture(){var k=lg.ch,tb=lg.tb,p=PT[k];
if(!pw)return screen([],"M0 90H300",T("Flat line at 0 V.","Ligne plate à 0 V."),0),note("bad",T("Board is off","Carte éteinte"),T("A powered-off board carries no signals, so you capture a flat 0 V line. Switch Board power ON.","Une carte éteinte ne porte aucun signal : ligne plate à 0 V. Allumez la carte."));
if(!lg.g){var d="M0 60",i;for(i=1;i<=75;i++)d+="L"+i*4+" "+(30+Math.random()*60);return screen([],d,T("Noisy trace.","Trace bruitée."),1),note("bad",T("No ground connected","Masse non connectée"),T("Without the ground lead on GND the analyser has no reference: the input floats and picks up noise. Clip GND first, then the signal.","Sans la pince de masse sur GND, l’analyseur n’a pas de référence : l’entrée flotte et capte du bruit. Pincez GND d’abord, puis le signal."))}
var d2=wave(k,tb),txt,kind="tip",title,body;
if(k=="tp"){if(tb==1){G.clk=1;screen([],d2,T("CLOCK 1.000 MHz · 3.3 V · duty 50 %","HORLOGE 1,000 MHz · 3,3 V · rapport cyclique 50 %"));title=T("Clock found","Horloge trouvée");body=T("A regular square wave: period 1 µs = 1 MHz. A clock is the chip’s metronome.","Un signal carré régulier : période 1 µs = 1 MHz. L’horloge est le métronome de la puce.");kind="ok"}
else{screen([],d2,T("Too dense to read","Trop dense pour être lu"));title=T("Wrong time/div for a clock","Mauvaise base de temps pour une horloge");body=T("At "+tb+" µs/div you squeeze "+(10*tb)+" cycles on screen. Use 1 µs/div to see individual cycles.","À "+tb+" µs/div on comprime "+(10*tb)+" cycles à l’écran. Utilisez 1 µs/div pour voir chaque cycle.");kind="bad"}}
else if(k=="tx"){if(tb==1){screen([],d2,T("Idle HIGH 3.3 V","Repos HAUT 3,3 V"));title=T("Window too short","Fenêtre trop courte");body=T("One UART bit lasts 8.68 µs at 115200 baud, so 10 µs shows less than one bit. Zoom out to 10 or 100 µs/div.","Un bit UART dure 8,68 µs à 115200 bauds : 10 µs montrent moins d’un bit. Passez à 10 ou 100 µs/div.");kind="bad"}
else if(tb==10){screen([],d2,"UART 115200 8N1 · 0x42 = ‘B’");title=T("One UART character: ‘B’","Un caractère UART : ‘B’");body=T("The line idles high, drops low for the start bit, then sends 8 data bits (LSB first) and a stop bit high. Bit width 8.68 µs gives 1 ÷ 8.68 µs ≈ 115200 baud. Try 100 µs/div for the whole message.","La ligne reste haute, descend pour le bit de départ, puis envoie 8 bits de données (poids faible d’abord) et un bit d’arrêt haut. Largeur de bit 8,68 µs donne 1 ÷ 8,68 µs ≈ 115200 bauds. Essayez 100 µs/div pour tout le message.");kind="ok"}
else{G.uart=1;screen([],d2,"UART 115200 8N1 · 42 4F 4F 54 3E → ‘BOOT>’");title=T("Message decoded: BOOT>","Message décodé : BOOT>");body=T("Five characters, 42 4F 4F 54 3E in hexadecimal. The baud rate you measured (115200) is what the serial adapter must use.","Cinq caractères, 42 4F 4F 54 3E en hexadécimal. La vitesse mesurée (115200 bauds) est celle que l’adaptateur série doit utiliser.");kind="ok"}}
else{screen([],"M0 30H300",T("Constant HIGH 3.3 V · nothing to decode","Constant HAUT 3,3 V · rien à décoder"));title=p.n[L]+T(": flat","  : plat");body=p.m?p.m[L]+" "+T("No activity to decode here. Try TP1 (clock) or TX (data).","Aucune activité à décoder ici. Essayez TP1 (horloge) ou TX (données).") :""}
note(kind,title,body);ui()}
function hd(s){var o="";for(var i=0;i<s.length;i+=16){var c=s.slice(i,i+16),h="",a="";for(var j=0;j<16;j++){var k=c.charCodeAt(j);h+=(isNaN(k)?"00":("0"+k.toString(16)).slice(-2))+" ";a+=(k>31&&k<127)?c[j]:"."}o+=("0000000"+i.toString(16)).slice(-8)+"  "+h+"|"+a+"|\n"}return o}
function typeOut(txt,done){var e=$("term"),i=0;e.textContent="";$("l1").classList.add("blink");$("l2").classList.add("blink");var iv=setInterval(function(){e.textContent+=txt.slice(i,i+3);i+=3;e.scrollTop=e.scrollHeight;if(i>=txt.length){clearInterval(iv);$("l1").classList.remove("blink");$("l2").classList.remove("blink");if(done)done()}},22)}
function serial(){var o="<option value=''>…</option>"+["TX","RX","GND","VCC"].map(function(v){return"<option>"+v+"</option>"}).join("")+"<option value='none'>"+T("not connected","non connecté")+"</option>";
var f=function(n,i){return'<div class="row"><label for="s'+i+'">'+n+' →</label><select id="s'+i+'">'+o+"</select></div>"};
$("bench").innerHTML='<svg viewBox="0 0 320 100" role="img" aria-label="USB-serial adapter"><rect x="0" y="32" width="48" height="36" fill="#bbb" stroke="#555"/><rect x="48" y="12" width="272" height="76" rx="8" fill="#1f5fbf"/><rect x="92" y="35" width="40" height="30" fill="#111"/><circle id="l1" cx="150" cy="30" r="5" fill="#ff4d4d"/><circle id="l2" cx="168" cy="30" r="5" fill="#5dff9f"/><text x="150" y="50" font-size="8" fill="#fff">TX RX</text>'+["RX","TX","GND","VCC"].map(function(n,i){return'<circle cx="'+(214+i*26)+'" cy="38" r="6" fill="var(--trace)"/><text x="'+(214+i*26)+'" y="64" font-size="9" fill="#fff" text-anchor="middle">'+n+"</text>"}).join("")+"</svg>"+f("Adapter RX",0)+f("Adapter TX",1)+f("Adapter GND",2)+f("Adapter VCC",3)+'<div class="row"><label for="lv">'+T("Logic level","Niveau logique")+'</label><select id="lv"><option>3.3 V</option><option>5 V</option></select><label for="bd">Baud</label><select id="bd"><option>9600</option><option selected>115200</option><option>921600</option></select></div><button class="go" id="go">'+T("Connect","Connecter")+'</button><pre id="term"></pre><div class="row" id="cmd" hidden><label for="ci">xr221&gt;</label><input id="ci" autocomplete="off" spellcheck="false" placeholder="help"></div>';
$("go").onclick=function(){var v=[0,1,2,3].map(function(i){return $("s"+i).value}),m=null,t,b;$("cmd").hidden=true;
if(v.indexOf("")>-1){t=T("Incomplete wiring","Câblage incomplet");b=T("Choose a value for each adapter pin.","Choisissez une valeur pour chaque broche de l’adaptateur.")}
else if(v[3]!="none"){t=T("VCC connected","VCC connecté");b=T("The device has its own supply. Tying two supplies together can burn the chip or the adapter. Leave VCC unconnected.","L’appareil a sa propre alimentation. Relier deux alimentations peut griller la puce ou l’adaptateur. Laissez VCC non connecté.")}
else if($("lv").value=="5 V"){t=T("5 V logic on a 3.3 V chip","Logique 5 V sur une puce 3,3 V");b=T("Signals above 3.3 V + 0.3 V exceed the chip’s rating and can destroy its pins. Set the adapter to 3.3 V.","Des signaux au-dessus de 3,3 V + 0,3 V dépassent les limites de la puce et peuvent détruire ses broches. Réglez l’adaptateur sur 3,3 V.")}
else if(v[2]!="GND"){t=T("No common ground","Pas de masse commune");b=T("Without GND to GND both sides disagree on what 0 V is, so data is unreadable. Connect adapter GND to device GND.","Sans GND vers GND, les deux côtés ne s’accordent pas sur le 0 V : données illisibles. Reliez GND de l’adaptateur à GND de l’appareil.")}
else if(!(v[0]=="TX"&&v[1]=="RX")){t=T("TX/RX not crossed","TX/RX non croisés");b=T("Two talkers cannot hear each other. What the device sends on TX must arrive on the adapter’s RX, and the adapter’s TX must reach the device’s RX.","Deux émetteurs ne s’entendent pas. Ce que l’appareil envoie sur TX doit arriver sur RX de l’adaptateur, et TX de l’adaptateur doit atteindre RX de l’appareil.")}
else if(!pw){t=T("Board is off","Carte éteinte");b=T("Wiring is right, but nothing runs: switch Board power ON, then connect.","Le câblage est bon mais rien ne fonctionne : allumez la carte puis connectez.")}
else if($("bd").value!="115200"){var gb="",c="▒#@%&?¤§ÿ";for(var i=0;i<140;i++)gb+=i%36==35?"\n":c[Math.floor(Math.random()*c.length)];typeOut(gb);return note("bad",T("Wrong baud rate","Mauvaise vitesse"),T("Garbage characters mean the adapter samples bits at the wrong speed. Use the bit width measured on the analyser: 8.68 µs = 115200 baud.","Des caractères illisibles signifient que l’adaptateur échantillonne à la mauvaise vitesse. Utilisez la largeur de bit mesurée : 8,68 µs = 115200 bauds."))}
if(t){$("term").textContent="";return note("bad",t,b)}
typeOut("U-Boot 2019.07 (XR221)\nDRAM:  64 MiB\nFlash: 4 MiB (25Q32)\nLoading firmware v1.0 ... OK\n\n"+T("Type help.","Tapez help."),function(){$("cmd").hidden=false;$("ci").focus()});
note("ok",T("Connected at 115200 baud","Connecté à 115200 bauds"),T("The wiring, 3.3 V level and speed are right, so the boot log appears. Try help, version, dump.","Câblage, niveau 3,3 V et vitesse corrects : le journal de démarrage s’affiche. Essayez help, version, dump."))};
$("ci").onkeydown=function(e){if(e.key!="Enter")return;var c=this.value.trim(),r;this.value="";
if(c=="help")r="help, version, dump";else if(c=="version")r="XR221 firmware v1.0 (build 2312)";
else if(c=="dump"){r=hd("XR221 FW v1.0\0\0\0wifi_ssid=HomeNet\0pass=1234\0");G.dump=1;ui();note("ok",T("Firmware dumped","Firmware extrait"),T("The hexdump shows the stored program. The right column shows readable text: a Wi-Fi name and password in clear text, a typical weakness reverse engineers report.","Le hexdump montre le programme stocké. La colonne de droite affiche le texte lisible : un nom et un mot de passe Wi-Fi en clair, une faiblesse typique que signalent les rétro-ingénieurs."))}
else r=T("unknown command","commande inconnue");$("term").textContent+="\nxr221> "+c+"\n"+r;$("term").scrollTop=1e5}}
